<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Daily aptitude practice for placements, CAT, banking and more: short daily challenges, focused practice by topic and friendly weekly leagues." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aptric" />
    <meta property="og:title" content="Aptric – Practice. Compete. Grow." />
    <meta property="og:description" content="Short daily aptitude challenges, focused practice and friendly leagues for placements, CAT, banking and more." />
    <!-- Relative path: crawlers that need an absolute URL should get the deployed origin prepended at deploy time. -->
    <meta property="og:image" content="/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Aptric logo and “Practice. Compete. Grow.” on navy, beside a glowing mountain path: daily aptitude practice for placements, CAT, banking and more" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aptric – Practice. Compete. Grow." />
    <meta name="twitter:description" content="Short daily aptitude challenges, focused practice and friendly leagues for placements, CAT, banking and more." />
    <meta name="twitter:image" content="/brand/og.png" />
    <!-- Browser UI colour: matches the app header (--header), white or midnight. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1226" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <title>Aptric – daily aptitude practice</title>
    <!-- Page colour before the stylesheet arrives, so dark mode doesn't flash white. -->
    <style>html{background:#f8fafc}html[data-theme='dark']{background:#0a1020;color-scheme:dark}</style>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('aptric.theme');
          var dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          if (localStorage.getItem('aptric.motion') === 'reduce') document.documentElement.dataset.reduceMotion = 'true';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Aptric needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
